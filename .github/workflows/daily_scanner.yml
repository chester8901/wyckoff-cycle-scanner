name: Daily Wyckoff Cycle Scanner

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC
    # (5:30 PM EDT during summer / 4:30 PM EST during winter)
    # Safely executes after US market close all year round, immune to Daylight Saving shifts.
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger directly from the GitHub Actions web interface

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Wyckoff Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
